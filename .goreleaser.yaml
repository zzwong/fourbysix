# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/fourbysix
    binary: fourbysix
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.example.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - name: fourbysix
    binaries: [fourbysix]
    homepage: https://github.com/zzwong/fourbysix
    description: Crop shipping and return-label PDFs onto 4x6 thermal labels
    license: MIT
    directory: Casks
    commit_author:
      name: zzwong-tap-publisher[bot]
      email: zzwong-tap-publisher[bot]@users.noreply.github.com
    repository:
      owner: zzwong
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The binary is not signed or notarized, so macOS would quarantine it
    # and refuse to run it. Clear the quarantine bit after install.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/fourbysix"]
          end
